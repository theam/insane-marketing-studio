<title>Storyboard review</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1c1b19; --ink-2: #5d5a54; --line: #e3e0da; --accent: #d9481f;
  --ok: #1f8a4c; --ok-bg: #e5f4ea; --chg: #b4530a; --chg-bg: #fdf0e1; --chip: #efede8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131312; --panel: #1d1c1a; --ink: #eceae5; --ink-2: #a9a59d; --line: #2f2d2a; --accent: #ff7a4d;
    --ok: #5fd08f; --ok-bg: #173323; --chg: #f2a65a; --chg-bg: #3a2814; --chip: #282724;
  }
}
:root[data-theme="dark"] {
  --bg: #131312; --panel: #1d1c1a; --ink: #eceae5; --ink-2: #a9a59d; --line: #2f2d2a; --accent: #ff7a4d;
  --ok: #5fd08f; --ok-bg: #173323; --chg: #f2a65a; --chg-bg: #3a2814; --chip: #282724;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
header { padding: 28px 24px 12px; max-width: 1280px; margin: 0 auto; }
h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
.pill { background: var(--chip); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--ink-2); }
.pill b { color: var(--ink); }
.status { font-size: 13px; color: var(--ink-2); margin-left: auto; }
main { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; padding: 12px 24px 48px; max-width: 1280px; margin: 0 auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.card.ok { border-color: var(--ok); }
.card.change { border-color: var(--chg); }
.card img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: #000; }
.meta { padding: 10px 12px 0; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.id { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--chip); padding: 2px 8px; border-radius: 6px; }
.time { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.sec { color: var(--ink-2); font-size: 12px; margin-left: auto; }
.said { padding: 6px 12px 0; font-size: 14px; }
.said:empty::before { content: "(no narration on this shot)"; color: var(--ink-2); }
.verdict { display: flex; gap: 6px; padding: 10px 12px 0; }
.verdict button { flex: 1; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px; padding: 7px 0; font: inherit; font-size: 14px; cursor: pointer; }
.verdict button[aria-pressed="true"].ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.verdict button[aria-pressed="true"].change { background: var(--chg-bg); border-color: var(--chg); color: var(--chg); font-weight: 600; }
textarea { margin: 8px 12px 0; width: calc(100% - 24px); min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; font-size: 14px; padding: 8px; }
.who { padding: 4px 12px 12px; font-size: 12px; color: var(--ink-2); min-height: 22px; }
.readonly .verdict button, .readonly textarea { pointer-events: none; opacity: 0.6; }
@media (max-width: 520px) { header, main { padding-left: 16px; padding-right: 16px; } main { grid-template-columns: 1fr; } }
</style>
<header>
  <h1 id="title">Storyboard</h1>
  <div class="sub">One card per shot of the current cut. Mark each shot <b>OK</b> or <b>Change</b> and say what to change: the notes go straight to the production.</div>
  <div class="bar"><span class="pill" id="count"></span><span class="pill" id="tally"></span><span class="status" id="status">Loading notes…</span></div>
</header>
<main id="grid"></main>
<script src="board.js"></script>
<script>
const fmt = s => { const m = Math.floor(s / 60), r = (s - m * 60).toFixed(1).padStart(4, '0'); return `${m}:${r}`; };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const state = { board: null, notes: {}, db: null, user: null, me: null, canWrite: false, names: {} };
const cards = {};

async function loadBoard() {
  state.board = window.BOARD || await (await fetch('board.json')).json();
  document.getElementById('title').textContent = `${state.board.title} · storyboard v${state.board.version}`;
  document.getElementById('count').innerHTML = `<b>${state.board.shots.length}</b> shots · ${fmt(state.board.duration)}`;
  const grid = document.getElementById('grid');
  for (const s of state.board.shots) {
    const c = el('article', 'card'); c.id = 'shot-' + s.id;
    const img = el('img'); img.src = s.img; img.alt = `Shot ${s.id}`; img.loading = 'lazy'; c.append(img);
    const meta = el('div', 'meta'); meta.append(el('span', 'id', s.id), el('span', 'time', `${fmt(s.t)}–${fmt(s.end)}`), el('span', 'sec', s.section)); c.append(meta);
    c.append(el('div', 'said', s.text));
    const v = el('div', 'verdict');
    const ok = el('button', 'ok', 'OK'), ch = el('button', 'change', 'Change');
    ok.onclick = () => save(s.id, { status: cur(s.id).status === 'ok' ? '' : 'ok' });
    ch.onclick = () => save(s.id, { status: cur(s.id).status === 'change' ? '' : 'change' });
    v.append(ok, ch); c.append(v);
    const ta = el('textarea'); ta.placeholder = 'What should change? (optional)';
    let timer = null;
    ta.oninput = () => { clearTimeout(timer); timer = setTimeout(() => save(s.id, { note: ta.value }), 900); };
    c.append(ta);
    const who = el('div', 'who'); c.append(who);
    grid.append(c);
    cards[s.id] = { c, ok, ch, ta, who };
  }
  paint();
}
const cur = id => state.notes[id] || {};
async function paint() {
  let nOk = 0, nCh = 0;
  const ids = [...new Set(Object.values(state.notes).map(n => n.by).filter(Boolean))];
  if (state.user && ids.length) { try { state.names = await state.user.profiles(ids); } catch {} }
  for (const [id, k] of Object.entries(cards)) {
    const n = cur(id);
    k.c.classList.toggle('ok', n.status === 'ok'); k.c.classList.toggle('change', n.status === 'change');
    k.ok.setAttribute('aria-pressed', n.status === 'ok'); k.ch.setAttribute('aria-pressed', n.status === 'change');
    if (document.activeElement !== k.ta) k.ta.value = n.note || '';
    const who = n.by ? ((state.names[n.by] && state.names[n.by].name) || 'Someone') : '';
    k.who.textContent = n.at ? `${who ? who + ' · ' : ''}${new Date(n.at).toLocaleString()}` : '';
    if (n.status === 'ok') nOk++; if (n.status === 'change') nCh++;
  }
  document.getElementById('tally').innerHTML = `<b>${nOk}</b> OK · <b>${nCh}</b> to change`;
}
async function save(id, patch) {
  if (!state.db || !state.canWrite) return;
  const next = { ...cur(id), ...patch, by: state.me, at: new Date().toISOString() };
  state.notes[id] = next; paint();
  try { await state.db.collection('notes').doc(id).set(next); setStatus('Saved'); }
  catch (e) { setStatus(e && e.code === 'not_granted' ? 'You can view this board but not leave notes.' : 'Could not save that note. Try again.'); }
}
const setStatus = t => { document.getElementById('status').textContent = t; };

(async () => {
  try { await loadBoard(); } catch { setStatus('Could not load the board.'); return; }
  if (!window.claude || !window.claude.use) { setStatus('Opened from the disk: tell Claude your notes by shot id. (On claude.ai they save here.)'); document.body.classList.add('readonly'); return; }
  const timeout = setTimeout(() => setStatus('Notes are taking long to load.'), 10000);
  const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  state.db = db; state.user = user;
  if (!db) { clearTimeout(timeout); setStatus('Sign in to claude.ai to leave notes.'); document.body.classList.add('readonly'); return; }
  try { state.me = user ? await user.id() : null; } catch {}
  state.canWrite = user ? (await user.can('data.write')) !== false : true;
  if (!state.canWrite) document.body.classList.add('readonly');
  db.collection('notes').onSnapshot(snap => {
    clearTimeout(timeout);
    state.notes = {};
    snap.docs.forEach(d => { state.notes[d.id] = d.data() || {}; });
    setStatus(state.canWrite ? 'Notes save as you type.' : 'Read-only: you can view this board.');
    paint();
  }, () => { clearTimeout(timeout); setStatus('Could not load notes.'); });
})();
</script>
